    email:
      $ref: ../openapi.yaml#/components/schemas/Email
    nickname:
      $ref: ../openapi.yaml#/components/schemas/Nickname
    qq:
      type: string
      pattern: ^[0-9]{1,20}$
    status:
      type: string
      enum:
        - pending
        - approved
        - rejected
    createdAt:
      $ref: ../openapi.yaml#/components/schemas/SafeTimestamp
    reviewedAt:
      type:
        - integer
        - "null"
      minimum: 0
      maximum: 9007199254740991
    reviewedByUserId:
      $ref: ../openapi.yaml#/components/schemas/NullableUuid
    applicationType:
      type: string
      const: new
    communityId: &a6
      $ref: ../openapi.yaml#/components/schemas/CommunityId
    applicantUserId: &a7
      $ref: ../openapi.yaml#/components/schemas/Uuid
    legacyReadOnly:
      type: boolean
      const: false
    identitySnapshot: &a8
      anyOf:
        - $ref: ../openapi.yaml#/components/schemas/JoinIdentitySnapshot
        - type: "null"
    missingProviders: &a9
      type: array
      uniqueItems: true
      maxItems: 1
      items:
        type: string
        const: cfx
