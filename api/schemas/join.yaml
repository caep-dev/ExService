JoinReviewRequest:
  type: object
  additionalProperties: false
JoinApplicationRequest:
  description: "Only multipart: exactly one application/json part (application.json, at most 64 KiB), optional proofs.
    Unknown parts, duplicate application, truncation and forged markers are rejected; application and all bytes commit
    atomically."
  oneOf:
    - $ref: ../openapi.yaml#/components/schemas/JoinNewApplicationRequest
    - $ref: ../openapi.yaml#/components/schemas/JoinExperiencedApplicationRequest
JoinApplicationQq:
  type: string
  pattern: ^[0-9]{5,13}$
  description: New application QQ; preserve leading zeroes. Account and legacy summary QQ retain 1?20 digits.
JoinNewAnswers:
  type: object
  additionalProperties: false
  required:
    - fiveMExperience
    - emergencyRoleplayKnowledge
    - emergencyProceduresKnowledge
    - rpUnderstanding
    - frpUnderstanding
  properties:
    fiveMExperience:
      type: string
      minLength: 1
      maxLength: 4000
    emergencyRoleplayKnowledge:
      type: string
      minLength: 1
      maxLength: 4000
    emergencyProceduresKnowledge:
      type: string
      minLength: 1
      maxLength: 4000
    rpUnderstanding:
      type: string
      minLength: 1
      maxLength: 4000
    frpUnderstanding:
      type: string
      minLength: 1
      maxLength: 4000
JoinExperiencedAnswers:
  type: object
  additionalProperties: false
  required:
    - previousServer
    - leaveReason
    - previousDepartment
    - lawEnforcementExperience
    - highestRank
    - punishmentHistory
    - deescalationEssay
    - discretionEssay
    - transferReason
  properties:
    previousServer:
      type: string
      minLength: 1
      maxLength: 256
    leaveReason:
      type: string
      minLength: 1
      maxLength: 4000
    previousDepartment:
      type: string
      minLength: 1
      maxLength: 256
    lawEnforcementExperience:
      type: string
      minLength: 1
      maxLength: 4000
    highestRank:
      type: string
      minLength: 1
      maxLength: 256
    punishmentHistory:
      type: string
      minLength: 1
      maxLength: 4000
    deescalationEssay:
      type: string
      minLength: 150
      maxLength: 4000
    discretionEssay:
      type: string
      minLength: 150
      maxLength: 4000
    transferReason:
      type: string
      minLength: 1
      maxLength: 4000
JoinNewCommitments:
  type: object
  additionalProperties: false
  required:
    - informationAccurate
    - obeyCommunityRules
    - acceptAcademyAttendanceConsequences
  properties:
    informationAccurate:
      type: boolean
      const: true
    obeyCommunityRules:
      type: boolean
      const: true
    acceptAcademyAttendanceConsequences:
      type: boolean
      const: true
JoinExperiencedCommitments:
  type: object
  additionalProperties: false
  required:
    - informationAccurate
  properties:
    informationAccurate:
      type: boolean
      const: true
    obeyCommunityRules:
      type: boolean
      const: true
      description: Present on applications submitted by the current form; optional for previously stored version 1 forms.
JoinNewForm:
  type: object
  additionalProperties: false
  required:
    - applicationType
    - birthDate
    - applicantCategory
    - department
    - freeTime
    - discoveryChannels
    - answers
    - commitments
  properties:
    applicationType:
      type: string
      const: new
    birthDate: &a1
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      description: Valid Gregorian YYYY-MM-DD date no later than server UTC today; never a timestamp.
    applicantCategory: &a2
      type: string
      enum:
        - "100"
        - "101"
        - 102a
        - 102b
    department: &a3
      type: string
      enum:
        - leo
        - ems
    freeTime: &a4
      type: string
      minLength: 1
      maxLength: 256
      description: Selected option or actual free text; trim before Unicode code point counting.
    discoveryChannels: &a5
      type: array
      minItems: 1
      maxItems: 4
      uniqueItems: true
      items:
        type: string
        enum:
          - bilibili
          - douyin
          - friends
          - other
    answers:
      $ref: ../openapi.yaml#/components/schemas/JoinNewAnswers
    commitments:
      $ref: ../openapi.yaml#/components/schemas/JoinNewCommitments
  description: Answer and freeTime strings are trimmed then counted as Unicode code points. The server independently
    checks calendar and text semantics.
JoinNewApplicationPayload:
  type: object
  additionalProperties: false
  required:
    - qq
    - form
  properties:
    qq:
      $ref: ../openapi.yaml#/components/schemas/JoinApplicationQq
    form:
      $ref: ../openapi.yaml#/components/schemas/JoinNewForm
JoinNewApplicationRequest:
  type: object
  additionalProperties: false
  required:
    - application
  properties:
    application:
      $ref: ../openapi.yaml#/components/schemas/JoinNewApplicationPayload
    proofs:
      type: array
      maxItems: 0
      items:
        type: string
        format: binary
      description: Repeated same-name parts; private raw files must pair one-to-one with validated body markers.
JoinExperiencedForm:
  type: object
  additionalProperties: false
  required:
    - applicationType
    - birthDate
    - applicantCategory
    - department
    - freeTime
    - discoveryChannels
    - answers
    - commitments
  properties:
    applicationType:
      type: string
      const: experienced
    birthDate: *a1
    applicantCategory: *a2
    department: *a3
    freeTime: *a4
    discoveryChannels: *a5
    answers:
      $ref: ../openapi.yaml#/components/schemas/JoinExperiencedAnswers
    commitments:
      $ref: ../openapi.yaml#/components/schemas/JoinExperiencedCommitments
  description: Answer and freeTime strings are trimmed then counted as Unicode code points. The server independently
    checks calendar and text semantics.
JoinExperiencedApplicationPayload:
  type: object
  additionalProperties: false
  required:
    - qq
    - form
  properties:
    qq:
      $ref: ../openapi.yaml#/components/schemas/JoinApplicationQq
    form:
      $ref: ../openapi.yaml#/components/schemas/JoinExperiencedForm
JoinExperiencedApplicationRequest:
  type: object
  additionalProperties: false
  required:
    - application
  properties:
    application:
      $ref: ../openapi.yaml#/components/schemas/JoinExperiencedApplicationPayload
    proofs:
      type: array
      maxItems: 5
      items:
        type: string
        format: binary
      description: Repeated same-name parts; private raw files must pair one-to-one with validated body markers.
JoinApplicationPayload:
  oneOf:
    - $ref: ../openapi.yaml#/components/schemas/JoinNewApplicationPayload
    - $ref: ../openapi.yaml#/components/schemas/JoinExperiencedApplicationPayload
JoinApplicationAttachment:
  type: object
  additionalProperties: false
  required:
    - id
    - originalName
    - extension
    - byteLength
    - sha256
    - ordinal
  properties:
    id:
      $ref: ../openapi.yaml#/components/schemas/Uuid
    originalName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: ^[^\\/\u0000-\u001F\u007F-\u009F]+$
      description: Safe basename; reject path separators, controls, dot directory names and header injection characters.
    extension:
      type: string
      enum:
        - png
        - jpg
        - jpeg
        - gif
        - bmp
        - svg
        - pdf
        - doc
        - docx
        - xls
        - xlsx
        - ppt
        - pptx
        - txt
        - zip
        - rar
        - 7z
    byteLength:
      type: integer
      minimum: 1
      maximum: 10485760
    sha256:
      type: string
      pattern: ^[0-9a-f]{64}$
    ordinal:
      type: integer
      minimum: 0
      maximum: 4
JoinNewApplicationSummary:
  type: object
  additionalProperties: false
  required:
    - id
    - email
    - nickname
    - qq
    - status
    - createdAt
    - reviewedAt
    - reviewedByUserId
    - applicationType
    - communityId
    - applicantUserId
    - legacyReadOnly
    - identitySnapshot
    - missingProviders
