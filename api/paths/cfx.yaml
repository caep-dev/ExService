/auth/cfx/attempts:
  post:
    operationId: createCfxAttempt
    summary: createCfxAttempt
    tags: [authentication]
    security: []
    description: |
      Browser-bound Cfx verification; does not create a Website account or session.
      Configured mode only; mutations require exact configured Origin. Query keys cannot repeat.
      Cookie is optional in the schema but ownership is mandatory except for creation.
      Fixed CFX errors cover disabled/flow/origin, ownership/state, payload/nonce/version,
      user/email/upstream, timeout, capacity/rate and closed-service failures.
    parameters:
      - in: header
        name: Cookie
        required: false
        schema: { type: string, maxLength: 4096 }
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: '../openapi.yaml#/components/schemas/CfxEmptyRequest' }
    responses:
      '201':
        description: Browser-bound verification result
        headers:
          X-Request-Id: { $ref: '../openapi.yaml#/components/headers/RequestId' }
          Cache-Control: { $ref: '../openapi.yaml#/components/headers/CacheControl' }
          Referrer-Policy: { schema: { type: string, const: no-referrer } }
          X-Content-Type-Options: { $ref: '../openapi.yaml#/components/headers/ContentTypeOptions' }
          Set-Cookie:
            description: HttpOnly binding; SameSite=Lax, Path=/, Max-Age=1200; Secure in production.
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: '../openapi.yaml#/components/schemas/CfxAttemptCreated' }
      '400':
        description: Safe Cfx or framework error
