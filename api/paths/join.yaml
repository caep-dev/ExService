/admin/communities/{communityId}/applications/{applicationId}/attachments/{attachmentId}:
  get:
    operationId: downloadJoinApplicationAttachment
    summary: Download an application proof attachment
    description: Authorized community reviewer download. Check community, application and attachment ownership in one read
      snapshot. Original bounded bytes only; no inline preview. Existing response slot and deadline budgets apply.
    security:
      - bearerAuth: []
    tags:
      - authentication
    x-fastify-config:
      joinDownload:
        slots: 2
        deadlineMs: 60000
    parameters:
      - *a1
      - name: applicationId
        in: path
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/Uuid
      - name: attachmentId
        in: path
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/Uuid
    responses:
      "200":
        description: Original attachment bytes.
        headers:
          X-Request-Id:
            $ref: ../openapi.yaml#/components/headers/RequestId
          Cache-Control:
            $ref: ../openapi.yaml#/components/headers/CacheControl
          Content-Disposition:
            description: attachment; safe ASCII filename fallback and UTF-8 filename*.
            required: true
            schema:
              type: string
              pattern: ^attachment;
          X-Content-Type-Options:
            required: true
            schema:
              type: string
              const: nosniff
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      "400":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "401":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "403":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "404":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "500":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "503":
        $ref: ../openapi.yaml#/components/responses/RetryableErrorResponse
