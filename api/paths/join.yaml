/communities/{communityId}/applications:
  post:
    operationId: submitJoinApplication
    summary: Submit one complete join application
    description: Authenticated lifetime application for the path community. Applicant ownership and contact snapshots come
      from the current account. One multipart JSON part {qq,form} and optional proofs commit atomically. Cfx is a
      requirement, not a deduplication key.
    security:
      - bearerAuth: []
    tags:
      - authentication
    x-fastify-config:
      joinUpload:
        wireBytes: 67108864
        jsonBytes: 65536
        fileBytes: 10485760
        totalFileBytes: 52428800
        proofs: 5
        parts: 6
        fieldNameBytes: 64
        headerPairs: 32
        headerBytes: 16384
        slots: 2
        deadlineMs: 120000
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: ../openapi.yaml#/components/schemas/JoinApplicationRequest
          encoding:
            application:
              contentType: application/json
            proofs:
              contentType: "*/*"
    responses:
      "202":
        description: Successful operation; not cacheable.
        headers:
          X-Request-Id:
            $ref: ../openapi.yaml#/components/headers/RequestId
          Cache-Control:
            $ref: ../openapi.yaml#/components/headers/CacheControl
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/JoinApplicationReceived
      "400":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "401":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "403":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "404":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "408":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "409":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "413":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "415":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "429":
        $ref: ../openapi.yaml#/components/responses/RetryableErrorResponse
      "500":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "503":
        $ref: ../openapi.yaml#/components/responses/RetryableErrorResponse
      default:
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
    parameters:
      - &a1
        name: communityId
        in: path
        required: true
        schema:
          $ref: ../openapi.yaml#/components/schemas/CommunityId
/admin/communities/{communityId}/applications:
  get:
    operationId: listJoinApplications
    summary: listJoinApplications
    tags:
      - authentication
    security:
      - bearerAuth: []
    parameters:
      - *a1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
      - name: status
        in: query
        schema:
          type: string
          enum:
            - pending
            - approved
            - rejected
      - name: source
        in: query
        schema:
          type: string
          enum:
            - live
            - legacy
            - all
          default: live
    responses:
      "200":
        description: Successful operation; not cacheable.
        headers: &a2
          X-Request-Id:
            $ref: ../openapi.yaml#/components/headers/RequestId
          Cache-Control:
            $ref: ../openapi.yaml#/components/headers/CacheControl
          Referrer-Policy:
            schema:
              type: string
              const: no-referrer
          X-Content-Type-Options:
            $ref: ../openapi.yaml#/components/headers/ContentTypeOptions
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/JoinApplicationList
      "400":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "401":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "403":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      "404":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      default:
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
