/communities:
  get:
    operationId: listCommunities
    summary: listCommunities
    tags:
      - authentication
    security: []
    parameters: &a2
      - &a4
        name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      - &a5
        name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          default: 0
    responses:
      "200":
        description: Successful operation; not cacheable.
        headers: &a1
          X-Request-Id:
            $ref: ../openapi.yaml#/components/headers/RequestId
          Cache-Control:
            $ref: ../openapi.yaml#/components/headers/CacheControl
          Referrer-Policy:
            schema:
              type: string
              const: no-referrer
          X-Content-Type-Options:
            $ref: ../openapi.yaml#/components/headers/ContentTypeOptions
        content:
          application/json:
            schema:
              $ref: ../openapi.yaml#/components/schemas/CommunityList
      "400":
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
      default:
        $ref: ../openapi.yaml#/components/responses/ErrorResponse
