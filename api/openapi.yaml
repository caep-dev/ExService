components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    integrationKey:
      type: apiKey
      in: header
      name: X-Integration-Key
    bootstrapKey:
      type: apiKey
      in: header
      name: X-Bootstrap-Key
  headers:
    RequestId:
      description: Server-generated request identifier.
      required: true
      schema:
        type: string
        minLength: 1
    CacheControl:
      description: Authentication responses are not cacheable.
      required: true
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Whole seconds before a retry is allowed.
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    ContentDisposition:
      description: Always attachment; the filename is the last validated key segment, encoded as a quoted-string.
      schema:
        type: string
    ContentTypeOptions:
      description: Disables MIME sniffing so stored bytes are never rendered inline.
      schema:
        type: string
        const: nosniff
  responses:
    ErrorResponse:
      description: Safe application error response
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RetryableErrorResponse:
      description: Safe application error response with a retry delay
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/CacheControl"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CredentialErrorResponse:
      description: Safe application error response
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        Referrer-Policy:
          required: true
          schema:
            type: string
            const: no-referrer
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            const: nosniff
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    CredentialRetryableErrorResponse:
      description: Safe application error response with a retry delay
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        Referrer-Policy:
          required: true
          schema:
            type: string
            const: no-referrer
        X-Content-Type-Options:
          required: true
          schema:
            type: string
            const: nosniff
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
