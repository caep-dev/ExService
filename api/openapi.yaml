openapi: 3.1.1
info:
  title: ExWebsite Server API
  version: 0.7.0
  description: |
    Frontend 与 Backend 之间的唯一 HTTP API Contract。

    该 Contract 由本仓库唯一的 Fastify Server 和 TypeScript 客户端共同使用。
    所有 schema 限定在 JSON Schema Draft-07 兼容子集内。
servers:
  - url: /api
    description: 客户端 API base URL；Fastify 仍通过 Glue 的 prefix 显式注册该前缀。
tags:
  - name: system
    description: Server 自身运行状态。
  - name: authentication
    description: 本地账号、会话与 SSO 接收端能力。
  - name: identity
    description: Hydra 登录确认与受控服务间会话核验。
  - name: storage
    description: 通用内容存储的上传、直传确认与本地公开读取。
  - name: notifications
    description: 站内持久通知的收件箱、已读、不可恢复清理与通知偏好。
  - name: support
    description: 登录用户的反馈提交与恢复。
